<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4ef" />
    <meta name="color-scheme" content="light" />

    <title>Open Graph — See What Your Links Share</title>
    <meta name="description" content="Paste any link to inspect Open Graph metadata, preview social cards, and export high-resolution editorial preview images." />
    <meta name="keywords" content="open graph, og image, link preview, social preview card, metadata preview, og image preview" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook / LinkedIn / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Open Graph — See What Your Links Share" />
    <meta property="og:description" content="Paste a link to see the bigger picture. Fetch Open Graph metadata and export clean, high-resolution social preview cards." />
    <meta property="og:site_name" content="Open Graph" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Open Graph — See What Your Links Share" />
    <meta name="twitter:description" content="Paste a link to see the bigger picture. Fetch Open Graph metadata and export clean, high-resolution social preview cards." />
